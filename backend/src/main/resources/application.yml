spring:
  application:
    name: govalue-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/govalue}
    username: ${DB_USER:govalue}
    password: ${DB_PASSWORD:govalue}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
  flyway:
    enabled: true

govalue:
  jwt:
    # Em producao, defina JWT_SECRET com pelo menos 32 caracteres aleatorios.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  seed:
    # Cria usuarios FICTICIOS de demonstracao no primeiro start. Desligue em producao.
    enabled: ${SEED_DEMO_DATA:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
