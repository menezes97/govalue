services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: govalue
      POSTGRES_USER: ${DB_USER:-govalue}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-govalue}
    ports:
      - "5432:5432"
    volumes:
      - govalue-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-govalue} -d govalue"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      face-service:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/govalue
      DB_USER: ${DB_USER:-govalue}
      DB_PASSWORD: ${DB_PASSWORD:-govalue}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret-change-me}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      FACE_SERVICE_URL: http://face-service:8000
    ports:
      - "8080:8080"

  face-service:
    build: ./face-service
    environment:
      FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD:-0.6}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  govalue-db:
